name: Transaction creator backfill (one-off)

# Adds CreatorID (who actually made each move) to transaction files pulled before
# league_transactions.py saved it. Runs on the branch it is pushed to, never main.
on:
  # A workflow only becomes dispatchable once it exists on main, so a push to a branch
  # starts it too (the bot's own result commit uses GITHUB_TOKEN and does not re-trigger).
  push:
    branches: [tx-creator, history-backfill]
    paths: [scripts/tx_creator_backfill.py, .github/workflows/tx-creator.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tx-creator-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Refuse main
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then echo "::error::One-off backfill; run it on a branch"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - name: Add CreatorID
        run: python scripts/tx_creator_backfill.py
      - name: Summary
        if: always()
        run: |
          [ -f tx_creator_report.txt ] && while read -r l; do echo "::notice::$l"; done < tx_creator_report.txt || true
      - name: Commit to this branch
        if: always()
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/Transactions_*.csv data/backfill/Transactions_*.csv; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Transactions: add CreatorID (who made each move) from Sleeper"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0
            sleep 10
          done
          exit 1
