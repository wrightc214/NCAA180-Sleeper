name: Sleeper 2025 CCG replay to test league

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sleeper-ccg-announcements
  cancel-in-progress: false

jobs:
  announcements:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Trophy Room rendering dependencies
        run: python -m pip install -r requirements.txt
      - name: Replay all 15 trophies sequentially
        env:
          SLEEPER_SESSION_TOKEN: ${{ secrets.SLEEPER_SESSION_TOKEN }}
        run: |
          set -o pipefail
          python -u scripts/sleeper_ccg_announcements.py --year 2025 --replay-2025 \
            --out "$RUNNER_TEMP/ccg-trophies" | tee -a "$GITHUB_STEP_SUMMARY"
