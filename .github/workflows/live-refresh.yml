name: Live Scoreboard Refresh
# Each season, update the dated holiday cron overrides and the Eastern checkpoint windows
# in config/selection_watch.json together. See docs/selection-watch-operations.md.

on:
  # 🏈 Schedule (UTC times)
  schedule:
    # Thursday nights (8 PM–Midnight ET → Fri 00–04 UTC), every 15 minutes
    - cron: "*/15 0-3 * * FRI"

    # 2026 Thanksgiving and Black Friday daytime; update dates each CCG week (UTC).
    - cron: "*/15 17-23 26,27 11 *"
    - cron: "*/15 0-7 28 11 *"
    - cron: "*/15 4-7 30 11 *"
    - cron: "*/15 4-7 1 12 *"

    # Sunday (1 PM–Midnight ET → Sun 17–23 UTC, Mon 00–04 UTC)
    - cron: "*/30 17-23 * * SUN"
    - cron: "*/15 0-3 * * MON"

    # Monday nights (8 PM–Midnight ET → Tue 00–04 UTC), every 5 minutes
    - cron: "*/5 0-3 * * TUE"

  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write

# Live scores only matter once the postseason starts (CCG = week 12). Before that the
# daily update-leagues run already captures every finished week, so live commits only
# bloat the repo. Exception: weeks with a ranked-vs-ranked game (from the poll) refresh live too.
env:
  LIVE_START_WEEK: 12

concurrency:
  group: live-scoreboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # 🗓️ Step 1: Skip if outside NFL season (Sep 1 – Jan 15)
      # --------------------------------------------------------
      - name: Check if current date is within NFL season
        id: season_check
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          MONTH=$(date -u +%m)
          DAY=$(date -u +%d)
          RUN_SEASON=false

          if [ $MONTH -ge 9 ] && [ $MONTH -le 12 ]; then
            RUN_SEASON=true
          fi
          if [ $MONTH -eq 1 ] && [ $DAY -le 15 ]; then
            RUN_SEASON=true
          fi

          if [ "$RUN_SEASON" = "false" ]; then
            echo "⚠️ $TODAY is outside NFL season. Skipping workflow."
            echo "IN_SEASON=false" >> $GITHUB_ENV
            exit 0
          else
            echo "🏈 NFL season active ($TODAY). Continuing..."
            echo "IN_SEASON=true" >> $GITHUB_ENV
          fi

      - name: Skip notice (offseason)
        if: env.IN_SEASON != 'true'
        run: echo "🛑 Skipping job (offseason months)."

      # --------------------------------------------------------
      # 🧰 Step 2: Setup
      # --------------------------------------------------------
      - name: Checkout repo
        if: env.IN_SEASON == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: env.IN_SEASON == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: env.IN_SEASON == 'true'
        run: pip install pandas requests jq pytz

      - name: Cron heartbeat
        if: env.IN_SEASON == 'true'
        run: |
          echo "⏰ Cron fired at: $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
          echo "Tip: UTC = ET + 4 (during Daylight Time)."

      # --------------------------------------------------------
      # 🏈 Step 3: Check game status
      # --------------------------------------------------------
      - name: Check if games are active
        if: env.IN_SEASON == 'true'
        id: gamestatus
        run: python scripts/NFLgameStatus.py
        continue-on-error: true

      - name: Parse NFL status JSON
        if: env.IN_SEASON == 'true' && always()
        run: |
          if [ -f "nfl_status.json" ]; then
            WEEK_NUM=$(jq -r '.week_number' nfl_status.json)
            GAMES_ACTIVE=$(jq -r '.games_active' nfl_status.json)
            REFRESH_INTERVAL=$(jq -r '.refresh_interval' nfl_status.json)
            TIMESTAMP_ET=$(jq -r '.timestamp_et' nfl_status.json)
            echo "WEEK_NUM=$WEEK_NUM" >> $GITHUB_ENV
            echo "GAMES_ACTIVE=$GAMES_ACTIVE" >> $GITHUB_ENV
            echo "REFRESH_INTERVAL=$REFRESH_INTERVAL" >> $GITHUB_ENV
            echo "TIMESTAMP_ET=$TIMESTAMP_ET" >> $GITHUB_ENV
            echo "📅 Week: $WEEK_NUM | 🏈 Games active: $GAMES_ACTIVE | 🔁 Refresh: ${REFRESH_INTERVAL}m | 🕒 $TIMESTAMP_ET"
          else
            echo "⚠️ nfl_status.json not found — likely API error."
            echo "GAMES_ACTIVE=false" >> $GITHUB_ENV
          fi

      - name: Skip regular-season weeks
        if: env.GAMES_ACTIVE == 'true'
        run: |
          if [ -n "$WEEK_NUM" ] && [ "$WEEK_NUM" -lt "$LIVE_START_WEEK" ] 2>/dev/null; then
            # Exception: a ranked-vs-ranked game this week (data/RankedMatchups_Current.csv, from the poll).
            RVR=$(python -c "import csv,sys; r=list(csv.DictReader(open('data/RankedMatchups_Current.csv'))); print(sum(1 for x in r if x['Week']=='$WEEK_NUM' and x['RankedVsRanked']=='True'))" 2>/dev/null || echo 0)
            if [ "${RVR:-0}" -gt 0 ]; then
              echo "🏈 Week $WEEK_NUM has $RVR ranked-vs-ranked game(s); refreshing live."
            else
              echo "📴 Week $WEEK_NUM is before week $LIVE_START_WEEK; live refresh not needed (daily run covers it)."
              echo "GAMES_ACTIVE=false" >> $GITHUB_ENV
            fi
          fi

      # --------------------------------------------------------
      # ⏸️ Step 4: Skip if no active games
      # --------------------------------------------------------
      - name: Skip if no active games
        if: env.GAMES_ACTIVE != 'true'
        run: echo "😴 No live games right now. Skipping score refresh."

      # --------------------------------------------------------
      # 🔄 Step 5: Refresh data if games are active
      # --------------------------------------------------------
      - name: Refresh Scores for active week
        if: env.GAMES_ACTIVE == 'true'
        run: python scripts/score_details.py --week $WEEK_NUM

      # --------------------------------------------------------
      # 🕒 Step 6: Update LastUpdate.csv timestamps
      # --------------------------------------------------------
      - name: Update LastUpdate.csv
        if: env.GAMES_ACTIVE == 'true'
        run: python scripts/update_lastmodified.py

      # --------------------------------------------------------
      # Capture even when the window's last game is no longer active.
      # --------------------------------------------------------
      - name: Capture verified Selection Watch checkpoint
        if: env.IN_SEASON == 'true'
        continue-on-error: true
        env:
          SELECTION_WATCH_RECOVERY_DIR: ${{ runner.temp }}/selection-watch-recovery
        run: node scripts/selection_watch_timeline.js

      - name: Commit updated data
        if: env.IN_SEASON == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/Scores_Season.csv data/Scores_Week.csv data/LastUpdate.csv
          git add 'reports/postseason/selection-watch-timeline-[0-9][0-9][0-9][0-9].json' 2>/dev/null || true
          if git diff --cached --quiet --exit-code; then
            echo "No data changes detected."
            echo "DATA_CHANGED=false" >> $GITHUB_ENV
          else
            echo "📈 New data detected — committing update."
            git commit -m "Auto update live scores (Week $WEEK_NUM)"
            node scripts/publish_live_refresh.js
            echo "DATA_CHANGED=true" >> $GITHUB_ENV
          fi

      # --------------------------------------------------------
      # Keep the original checkpoint if publication failed after capture.
      - name: Retain unpublished Selection Watch checkpoint
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selection-watch-checkpoint-recovery
          path: ${{ runner.temp }}/selection-watch-recovery/*.json
          if-no-files-found: ignore

      # 📋 Step 8: Run summary
      # --------------------------------------------------------
      - name: Run summary
        if: always()
        run: |
          echo "🧾 --- SUMMARY ---"
          echo "📅 Week: ${WEEK_NUM:-unknown}"
          echo "🏈 Games active: ${GAMES_ACTIVE:-unknown}"
          echo "🔁 Refresh interval: ${REFRESH_INTERVAL:-unknown} min"
          echo "🕒 Timestamp (ET): ${TIMESTAMP_ET:-unknown}"
          echo "💾 Data changed: ${DATA_CHANGED:-unknown}"
