name: Scoreboard player statuses

# Refreshes data/scoreboard/<season>/players.json (injury/inactive status, team) with ONE
# server-side Sleeper call before game windows, so browsers never download the full player feed.
# Times are UTC and land before kickoff in both EDT and EST.
on:
  schedule:
    - cron: "45 12 * * SUN"   # before London / 9:30 ET games
    - cron: "30 16 * * SUN"   # before 1:00 PM ET window (inactives ~11:30 ET)
    - cron: "30 19 * * SUN"   # before 4:05/4:25 PM ET window
    - cron: "30 23 * * SUN"   # before SNF
    - cron: "30 23 * * MON"   # before MNF
    - cron: "30 23 * * THU"   # before TNF
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scoreboard-players
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Refresh player statuses
        run: python scripts/scoreboard_data.py --players-only
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scoreboard
          if git diff --cached --quiet; then echo "No status changes."; exit 0; fi
          git commit -m "Scoreboard player statuses"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 10; done
          exit 1
