name: Sleeper postseason matchups

on:
  schedule:
    # Wednesday noon EST / 1 PM EDT.
    - cron: '0 17 * * WED'
  workflow_dispatch:
    inputs:
      send:
        description: Send the approved current-round matchups to Sleeper
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sleeper-postseason-matchups
  cancel-in-progress: false

jobs:
  matchups:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: ${{ inputs.send == true }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt requests
      - name: Preview or deliver published matchups
        env:
          EVENT: ${{ github.event_name }}
          SEND: ${{ inputs.send }}
          SLEEPER_SESSION_TOKEN: ${{ inputs.send && secrets.SLEEPER_SESSION_TOKEN || '' }}
        run: |
          args=()
          if [[ "$EVENT" == schedule ]]; then
            args+=(--scheduled)
          elif [[ "$SEND" == true ]]; then
            args+=(--send)
          fi
          set -o pipefail
          python -u scripts/sleeper_postseason_matchups.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
