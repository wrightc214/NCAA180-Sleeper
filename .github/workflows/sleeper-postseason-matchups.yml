name: Sleeper postseason matchups

on:
  schedule:
    # Wednesday at noon and 4 PM EST (1 PM and 5 PM EDT).
    - cron: '0 17,21 * * WED'
  workflow_dispatch:
    inputs:
      approval_code:
        description: Code from the private LM preview (blank previews without approving)
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: sleeper-postseason-matchups
  cancel-in-progress: false

jobs:
  matchups:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: ${{ github.event_name == 'schedule' || inputs.approval_code != '' }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt requests
      - name: Preview or deliver published matchups
        env:
          EVENT: ${{ github.event_name }}
          APPROVAL_CODE: ${{ inputs.approval_code }}
          SLEEPER_SESSION_TOKEN: ${{ github.event_name == 'schedule' && secrets.SLEEPER_SESSION_TOKEN || '' }}
          DISCORD_WEBHOOK_LM_PRIVATE_DATA: ${{ github.event_name == 'schedule' && secrets.DISCORD_WEBHOOK_LM_PRIVATE_DATA || '' }}
          DISCORD_CONTACT_ID: ${{ vars.DISCORD_CONTACT_ID }}
        run: |
          args=()
          if [[ "$EVENT" == schedule ]]; then
            args+=(--scheduled)
          elif [[ -n "$APPROVAL_CODE" ]]; then
            args+=(--approve "$APPROVAL_CODE")
          fi
          set -o pipefail
          python -u scripts/sleeper_postseason_matchups.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
