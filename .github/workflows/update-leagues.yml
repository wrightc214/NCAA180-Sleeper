name: Python application

on:
  workflow_dispatch:
    inputs:
      script_to_run:
        description: 'Script to run (league_ids, rosters, users, rosterhistory, matchups, scores, max_points, weekly_awards, players, transactions, drafts, standings, orphans, lineup_streaks, player_values, draft_picks, weekly_report, roster_map, standings_page, conference_championships, playoff_field, bowls, nit, patch_orphans, all). Postseason scripts are manual only - not in all.'
        required: true
        default: 'all'
      post:
        description: 'Post the weekly report to Discord after this run (use to release a held post)'
        type: boolean
        default: false
  schedule:
    # Weekly: Sleeper advances the NFL week on Tuesday at a variable time. Wake every
    # 2h Tue 12:00 UTC -> Wed 18:00 UTC; week_gate.py runs the full job once per week.
    - cron: '0 12-22/2 * * TUE'
    - cron: '0 0-18/2 * * WED'

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - id: check
        run: python scripts/week_gate.py check

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run selected script(s)
        run: |
          # Default to 'all' if no manual input was provided
          SCRIPT_TO_RUN="${{ github.event.inputs.script_to_run }}"
          if [ -z "$SCRIPT_TO_RUN" ]; then
              SCRIPT_TO_RUN="all"
          fi
          echo "Selected script: $SCRIPT_TO_RUN"

          # One failing script no longer aborts everything after it.
          # Each failure is recorded; the step fails at the end if any did,
          # AFTER the commit step below still saves whatever succeeded.
          set +e
          FAILED=""
          run() {  # run <name> <file> [in_all]
              if [ "$SCRIPT_TO_RUN" = "$1" ] || { [ "$3" = "all" ] && [ "$SCRIPT_TO_RUN" = "all" ]; }; then
                  echo "::group::$1"
                  python "scripts/$2"
                  rc=$?
                  echo "::endgroup::"
                  if [ $rc -ne 0 ]; then
                      echo "::error::$1 ($2) failed with exit code $rc"
                      FAILED="$FAILED $1"
                  fi
              fi
          }

          run league_ids            league_ids.py            all
          run rosters               rosters.py               all
          run matchups              league_matchups.py       all
          run users                 users.py                 all
          run players               players.py               all
          run rosterhistory         rosterhistory.py         all
          run transactions          league_transactions.py   all
          run drafts                league_drafts.py         all
          run scores                score_details.py         all
          run max_points            max_points.py            all
          run weekly_awards         weekly_awards.py         all
          run standings             standings.py             all
          run orphans               orphans.py               all
          run lineup_streaks        lineup_streaks.py        all
          run player_values         player_values.py         all
          run draft_picks           draft_picks.py           all
          run weekly_report         weekly_report.py         all
          run roster_map            roster_map.py            all
          run standings_page        standings_page.py        all

          # One-time - delete after use
          run patch_orphans          patch_orphans_historic.py

          # Postseason - manual only
          run conference_championships conference_championships.py
          run playoff_field            playoff_field.py
          run bowls                    bowls.py
          run nit                      nit.py

          echo "$FAILED" > /tmp/failed_scripts.txt

      # Image only when the latest week's numbers changed (or the template/no image yet).
      - name: Check if report image needs rendering
        id: needpng
        if: always() && hashFiles('reports/index.html') != ''
        run: |
          if [ ! -f reports/latest.png ] || ! git diff --quiet HEAD -- reports/data templates || [ -n "$(git ls-files --others --exclude-standard reports/data)" ]; then
            echo "render=true" >> "$GITHUB_OUTPUT"
          else
            echo "render=false" >> "$GITHUB_OUTPUT"
            echo "Report data unchanged; skipping image."
          fi

      # Orphan recruiting card: re-render only when the open-team set changes or a draft completes.
      - name: Check orphan card
        id: orphan
        if: always()
        run: python scripts/orphan_card.py check

      - name: Install Playwright
        id: pw
        if: always() && (steps.needpng.outputs.render == 'true' || steps.orphan.outputs.render == 'true')
        run: |
          pip install playwright
          echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      # Browser is cached per Playwright version: downloaded once, then reused.
      - name: Cache Playwright browser
        if: always() && (steps.needpng.outputs.render == 'true' || steps.orphan.outputs.render == 'true')
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Render report image
        id: render
        if: always() && steps.needpng.outputs.render == 'true'
        continue-on-error: true
        run: |
          python -m playwright install-deps chromium
          python -m playwright install --only-shell chromium
          python scripts/report_png.py

      # Mark the Sleeper week done only after a clean full run, so a failed run retries.
      - name: Render orphan card
        if: always() && steps.orphan.outputs.render == 'true'
        continue-on-error: true
        run: |
          python -m playwright install-deps chromium
          python -m playwright install --only-shell chromium
          python scripts/orphan_card.py render

      - name: Mark week processed
        if: always()
        run: |
          SCRIPT_TO_RUN="${{ github.event.inputs.script_to_run }}"
          FAILED=$(cat /tmp/failed_scripts.txt 2>/dev/null)
          if [ "${SCRIPT_TO_RUN:-all}" = "all" ] && [ -z "$(echo $FAILED)" ]; then
              python scripts/week_gate.py mark
          fi

      - name: Commit and push CSVs
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          git add data/OrphanCard_Current.json 2>/dev/null || true
          git add reports/ || true
          git commit -m "Auto-update CSVs" || echo "No changes to commit"
          git push

      # Weekly Discord post: automatic on the scheduled weekly run, or manual with `post`.
      # Problems -> held, commissioner alerted privately instead.
      - name: Post to Discord
        if: always() && ((github.event_name == 'schedule') || (github.event.inputs.post == 'true'))
        env:
          DISCORD_WEBHOOK_TEAM_STATS: ${{ secrets.DISCORD_WEBHOOK_TEAM_STATS }}
          DISCORD_WEBHOOK_LM_PRIVATE_DATA: ${{ secrets.DISCORD_WEBHOOK_LM_PRIVATE_DATA }}
          DISCORD_CONTACT_ID: ${{ vars.DISCORD_CONTACT_ID }}
          PNG_STATUS: ${{ steps.render.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export FAILED="$(cat /tmp/failed_scripts.txt 2>/dev/null)"
          python scripts/discord_post.py

      # Weekly inactive-manager report -> private LM channel (alert webhook), same trigger as the post.
      - name: Inactivity report to LM channel
        if: always() && ((github.event_name == 'schedule') || (github.event.inputs.post == 'true'))
        env:
          DISCORD_WEBHOOK_LM_PRIVATE_DATA: ${{ secrets.DISCORD_WEBHOOK_LM_PRIVATE_DATA }}
          DISCORD_CONTACT_ID: ${{ vars.DISCORD_CONTACT_ID }}
        run: python scripts/inactivity_report.py

      - name: List CSVs
        if: always()
        run: ls -l data/

      - name: Record last modified times
        if: always()
        run: python scripts/update_lastmodified.py

      - name: Commit and push CSV modifieds
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          git add data/OrphanCard_Current.json 2>/dev/null || true
          git commit -m "Auto-update CSVs" || echo "No changes to commit"
          git push

      - name: Fail run if any script failed
        if: always()
        run: |
          FAILED=$(cat /tmp/failed_scripts.txt 2>/dev/null)
          if [ -n "$(echo $FAILED)" ]; then
              echo "::error::Failed scripts:$FAILED"
              exit 1
          fi
