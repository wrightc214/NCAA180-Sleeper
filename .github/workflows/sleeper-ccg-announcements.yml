name: Sleeper CCG trophy announcements

on:
  workflow_dispatch:
    inputs:
      year:
        description: Season year
        required: true
        type: string
      conference:
        description: Official conference short name (blank previews all)
        required: false
        type: string
      send:
        description: Post this one conference to live Sleeper chat
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sleeper-ccg-announcements
  cancel-in-progress: false

jobs:
  announcements:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Trophy Room rendering dependencies
        run: python -m pip install -r requirements.txt
      - name: Preview or post engraved trophies
        env:
          YEAR: ${{ inputs.year }}
          CONFERENCE: ${{ inputs.conference }}
          SEND: ${{ inputs.send }}
          SLEEPER_SESSION_TOKEN: ${{ inputs.send && secrets.SLEEPER_SESSION_TOKEN || '' }}
        run: |
          args=(--year "$YEAR" --conference "$CONFERENCE" --out "$RUNNER_TEMP/ccg-trophies")
          if [[ "$SEND" == true ]]; then
            args+=(--send)
          fi
          set -o pipefail
          python scripts/sleeper_ccg_announcements.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save plaque images for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sleeper-ccg-trophies
          path: ${{ runner.temp }}/ccg-trophies/*.png
          if-no-files-found: ignore
