name: Transactions PR validation (read-only)
on:
  pull_request:
    paths:
      - 'scripts/transactions_*.py'
      - 'scripts/player_values.py'
      - 'scripts/league_config.py'
      - 'scripts/site_common.py'
      - 'tests/test_transactions_page.py'
      - 'tests/transactions_browser.py'
      - 'config/nav.json'
      - 'config/league.json'
      - 'data/PlayerValues_Season.csv'
      - 'data/PickValues_Season.csv'
      - 'reports/transactions.html'
      - '.github/workflows/update-leagues.yml'
      - '.github/workflows/transactions-pr-check.yml'
permissions:
  contents: read
jobs:
  transactions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - name: Regenerate menu for configuration-consistency tests (checkout only)
        run: python3 scripts/menu_build.py
      - name: Python tests
        run: python3 -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript tests
        run: |
          for file in tests/*.test.js; do node "$file"; done
      - name: Generate transactions page
        run: |
          python3 scripts/transactions_page.py
          python3 scripts/menu_build.py
          test -s reports/transactions.html
          grep -q 'transactions.html' reports/assets/menu.js
      - name: Install Chromium for browser smoke checks
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser smoke checks (desktop light, mobile dark)
        run: python tests/transactions_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transactions-preview
          path: |
            reports/transactions.html
            work/transactions-preview/*.png
          if-no-files-found: ignore
