name: Pregame projection snapshot

# Manual snapshot of every rostered player's projection + lineup status.
# Game-day schedule retired 2026-10-13 (Chris): GitHub's scheduled runs were late or skipped,
# and Sleeper's feed serves each player's kickoff-time projection after the games anyway.
# The weekly run still takes the Tuesday baseline (upcoming week + weekly scoring check).
# Real-time lineups for the live scoreboard will need their own fetch when that launches.
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Write a snapshot even if no game kicks off soon (testing)'
        type: boolean
        default: true
      scoring_alert:
        description: 'Send the Discord alert if league scoring settings differ'
        type: boolean
        default: true

concurrency:
  group: projection-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - name: Snapshot projections
        env:
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
          DISCORD_WEBHOOK_LM_PRIVATE_DATA: ${{ secrets.DISCORD_WEBHOOK_LM_PRIVATE_DATA }}
          SCORING_ALERT: ${{ (github.event_name == 'schedule' && vars.SCORING_ALERT_ENABLED != 'true') && '0' || (github.event.inputs.scoring_alert == 'false' && '0' || '1') }}
        run: python scripts/projection_snapshot.py
      - name: Commit snapshot
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projections 2>/dev/null || true; git add data/ScoringCheck_Current.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Pregame projection snapshot"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
