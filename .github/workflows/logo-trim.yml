name: Validate logos and generate team glow
on:
  push:
    branches: [main]
    paths:
      - 'assets/logos/teams/**'
      - '!assets/logos/teams/glow-dark/**'
      - 'assets/logos/CCG/**'
      - 'assets/logos/Bowls/**'
      - 'assets/logos/badges/**'
      - 'assets/logos/Playoffs/**'
  workflow_dispatch:
    inputs:
      folder:
        description: Configured folder to validate. Leave blank to validate all configured folders.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: logo-trim
  cancel-in-progress: false

jobs:
  validate-and-glow:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==12.3.0
      - name: Validate logos
        env:
          LOGO_FOLDER: ${{ inputs.folder }}
        run: |
          if [ -n "$LOGO_FOLDER" ]; then
            python scripts/logo_trim.py "$LOGO_FOLDER"
          else
            python scripts/logo_trim.py
          fi
      - run: python scripts/logo_glow.py
      - name: Commit generated glow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/logos/teams/glow-dark
          if git diff --cached --quiet; then echo 'Glow is current.'; exit 0; fi
          git commit -m 'Refresh generated team logo glow'
          for attempt in 1 2 3; do
            git pull --rebase -q && git push origin HEAD:refs/heads/main && exit 0
            sleep 10
          done
          exit 1
