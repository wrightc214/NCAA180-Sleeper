name: Trim team logos

# Manual only: crop empty canvas around team logos after uploading new ones.
on:
  workflow_dispatch:
    inputs:
      folder:
        description: 'Logo folder'
        required: true
        default: 'assets/logos/teams'

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow
      - run: python scripts/logo_trim.py "${{ github.event.inputs.folder }}"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logos
          if git diff --cached --quiet; then echo "Nothing to trim."; exit 0; fi
          git commit -m "Trim logos"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 10; done
          exit 1
