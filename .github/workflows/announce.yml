name: Announce page

# Manual only (run when Chris says). Posts a "new page" graphic + short link to the league channel (team-stats),
# once per page (data/Announcements.json). Run after Chris approves the card.
on:
  workflow_dispatch:
    inputs:
      page:
        description: 'Page to announce'
        type: choice
        options: [managers, records, matchups, scoreboard]
        required: true
      force:
        description: 'Post again even if this page was already announced'
        type: boolean
        default: false
      dry_run:
        description: 'Render only (test); do not post to Discord'
        type: boolean
        default: false

concurrency:
  group: announce
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -r requirements.txt requests playwright
          python -m playwright install-deps chromium
          python -m playwright install --only-shell chromium
      - name: Render (named page) and post to team-stats
        env:
          DISCORD_WEBHOOK_TEAM_STATS: ${{ secrets.DISCORD_WEBHOOK_TEAM_STATS }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
          PAGE: ${{ github.event.inputs.page }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: |
          python scripts/announce_cards.py render "$PAGE"
          if [ "$DRY_RUN" = "1" ]; then echo "::notice::Dry run: rendered $PAGE, nothing posted"; exit 0; fi
          python scripts/announce_cards.py post "$PAGE"
      - name: Keep the rendered card (dry run) for review
        if: github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: announce-card
          path: reports/announce/*.png
      - name: Record announcement
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Announcements.json reports/announce || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Announcement posted"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
