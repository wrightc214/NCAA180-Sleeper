name: Announce page

# Manual only. Posts a "new page" graphic + short link to the league channel (team-stats),
# once per page (data/Announcements.json). Run after Chris approves the card.
on:
  workflow_dispatch:
    inputs:
      page:
        description: 'Page to announce'
        type: choice
        options: [managers, records]
        required: true
      force:
        description: 'Post again even if this page was already announced'
        type: boolean
        default: false

concurrency:
  group: announce
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -r requirements.txt requests playwright
          python -m playwright install-deps chromium
          python -m playwright install --only-shell chromium
      - name: Render card from today's data
        run: python scripts/announce_cards.py render ${{ github.event.inputs.page }}
      - name: Post to team-stats
        env:
          DISCORD_WEBHOOK_TEAM_STATS: ${{ secrets.DISCORD_WEBHOOK_TEAM_STATS }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: python scripts/announce_cards.py post ${{ github.event.inputs.page }}
      - name: Record announcement
        if: success()
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Announcements.json reports/announce || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Announced ${{ github.event.inputs.page }} page"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
