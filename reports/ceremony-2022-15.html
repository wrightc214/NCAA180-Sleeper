<style>
/* Layout: stadium-scoreboard header, then a two-column stat sheet (poll left, week detail right) that stacks on phones */
:root{--bg:#eef1f5;--panel:#ffffff;--ink:#14213a;--mute:#5d6a80;--line:#d5dbe5;--accent:#c8102e;--gold:#b8860b;--up:var(--good,#1a7f37);--dn:var(--bad,#b42318);
--disp:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;--body:"Barlow",system-ui,sans-serif;--num:"Barlow Condensed","Arial Narrow",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1526;--panel:#16213a;--ink:#e8edf6;--mute:#9aa7bd;--line:#2a3756;--accent:#ff5468;--gold:#e0b44a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1526;--panel:#16213a;--ink:#e8edf6;--mute:#9aa7bd;--line:#2a3756;--accent:#ff5468;--gold:#e0b44a;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:24px 40px;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:4px solid var(--accent);padding-bottom:12px}
.eyebrow{font:600 13px/1 var(--num);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h1{font:900 clamp(40px,8vw,72px)/.9 var(--disp);margin:6px 0 0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.kpis{display:flex;gap:22px;flex-wrap:wrap}
.kpi b{display:block;font:600 30px/1 var(--num);font-variant-numeric:tabular-nums}
.kpi span{font:600 11px/1.2 var(--num);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
h2{font:700 24px/1 var(--disp);text-transform:uppercase;letter-spacing:.03em;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font:500 12px var(--num);letter-spacing:.1em;color:var(--mute)}
section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.col{display:grid;gap:20px;min-width:0}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.n{font-family:var(--num);font-variant-numeric:tabular-nums}
.chip{display:inline-block;width:10px;height:22px;border-radius:2px;flex:none;margin-right:8px;vertical-align:middle;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35)}
small{color:var(--mute);font-weight:400}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{white-space:nowrap;font:600 11px var(--num);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);text-align:left;padding:4px 6px;border-bottom:2px solid var(--ink)}
th.r,td.n{text-align:right}
td{padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td.tm{display:flex;align-items:center;gap:0}
@media (max-width:640px){table{font-size:13px}td.tm{flex-wrap:wrap;white-space:normal}td.tm b{flex:1;min-width:0}td.tm small{flex-basis:100%;margin-left:18px!important;font-size:11px!important}td,th{padding:5px 3px}td.mv{width:26px;font-size:12px}th{letter-spacing:.06em}}
td.tm b{font-weight:700}td.tm small{margin-left:8px;font-size:12px}
td.mv{text-align:center;width:34px;font:600 13px var(--num)}
.up{color:var(--good,#1a7f37)}.dn{color:var(--bad,#b42318)}.eq{color:var(--mute)}
tr:nth-child(-n+4) td:first-child{color:var(--accent);font-weight:600}
.awards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.aw{background:var(--panel);padding:10px 12px;display:flex;flex-direction:column;gap:3px;text-align:center;align-items:center}
.aw:last-child:nth-child(odd){grid-column:1/-1}
@media (min-width:1000px){.awards{grid-template-columns:repeat(var(--cols),minmax(0,1fr))}.aw:last-child:nth-child(odd){grid-column:auto}}
.al{font:600 11px var(--num);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.av{font-size:28px;font-weight:600;line-height:1}.av small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.at{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;font-size:14px}.at small{margin-left:6px}
.ao{font-size:12px;color:var(--mute)}
.an{font-size:12px;color:var(--mute)}
ol,ul{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .rk{width:20px;color:var(--mute)}
.nm{flex:1;min-width:0;display:grid}.nm small{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v{font-size:20px;font-weight:600}
.pos{font:600 12px var(--num);letter-spacing:.08em;width:38px;text-align:center;padding:3px 0;border:1px solid var(--ink);border-radius:3px}
.lgs li{display:grid;grid-template-columns:104px 1fr 44px;align-items:center;gap:8px;padding:3px 0;font-size:14px}
.bar{height:12px;background:var(--bg);border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.lgs .n{text-align:right}
.note{font-size:12px;color:var(--mute);margin:8px 0 0}
footer{font-size:12px;color:var(--mute)}
.logo{width:56px;height:56px;object-fit:contain;flex:none;display:block;margin:4px 0 2px}
.ls{margin-top:auto;padding-top:14px;height:98px;display:flex;align-items:flex-end;justify-content:center}
.ls img{max-height:84px;max-width:100%;object-fit:contain}
.weeks{display:flex;flex-wrap:wrap;gap:6px;font:600 13px var(--num)}.weeks a{color:var(--mute);text-decoration:none;padding:2px 8px;border:1px solid var(--line);border-radius:3px}.weeks a[aria-current]{color:var(--panel);background:var(--ink);border-color:var(--ink)}
.weeks.sub{font-size:12px;margin-top:8px;align-items:center}.weeks.sub span{color:var(--mute);margin-right:2px}.weeks.sub a{padding:1px 7px}
.totop{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:50;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--bg);font:700 18px/1 var(--num);text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.25);opacity:.85}
.totop:hover,.totop:focus-visible{opacity:1}
.totop[hidden]{display:none}
@media print{.totop{display:none}}
/* team logos on dark backgrounds (CW, 2026-11-12): dark alt, else the glow file (site_common.logo_info) */@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .tl-d{display:none!important}}:root[data-theme="light"] .tl-d{display:none!important}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tl-hd{display:none!important}}:root[data-theme="dark"] .tl-hd{display:none!important}
</style>
<style>
@font-face{font-family:"Barlow Trophy";font-weight:700;font-display:block;src:url("../assets/fonts/barlow-latin-700-normal.woff2") format("woff2"),url("../assets/fonts/barlow-latin-700-normal.woff") format("woff")}
@font-face{font-family:"Barlow Trophy";font-weight:400;font-display:block;src:url("../assets/fonts/barlow-latin-400-normal.woff2") format("woff2"),url("../assets/fonts/barlow-latin-400-normal.woff") format("woff")}
.trophy{margin:0;width:min(var(--tw,180px),100%);flex:none}
.trophy-art{position:relative;container-type:inline-size;line-height:0}
.trophy-art>img{display:block;width:100%;height:auto;aspect-ratio:1}
.trophy-plaque{position:absolute;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden;font-family:"Barlow Trophy","Barlow",sans-serif;letter-spacing:-.02em;line-height:1.15;white-space:nowrap}
.trophy-plaque span{display:block;max-width:100%}
.trophy-plaque .tp-1{font-weight:700;color:inherit}.trophy-plaque .tp-2{font-weight:400;color:inherit}
.trophy-plaque .tp-up{text-transform:uppercase}
.trophy.fallback .trophy-art{aspect-ratio:auto;display:flex;flex-direction:column;align-items:center;gap:6%;padding:6% 4%;box-sizing:border-box;border:1px solid var(--line,#d5dbe5);border-radius:10px;background:var(--panel,#fff)}
.trophy.fallback .trophy-art>img{width:46%;aspect-ratio:1;object-fit:contain}
.trophy.fallback .trophy-plaque{position:relative;inset:auto;width:100%;aspect-ratio:4/1;background:#CFD4D8;border:2px solid #222934;border-radius:4px;box-sizing:border-box}

.ceremony-shelf{display:flex;flex-wrap:wrap;justify-content:center}
.ceremony-card{box-sizing:border-box;width:25%;min-width:0;display:flex;flex-direction:column;
  justify-content:flex-end;align-items:center;padding:8px 0 0;text-align:center;color:var(--ink)}
.ceremony-card.featured{width:100%}
.ceremony-card .trophy{width:min(92%,180px)}
.ceremony-card.featured .trophy{width:min(75%,230px)}
.ceremony-card p{width:100%;box-sizing:border-box;border-top:2px solid var(--gold);
  padding:6px 5px 9px;margin:0;overflow-wrap:anywhere;font-size:14px}
.ceremony-card small{display:block}
#trophy-ceremony{background:var(--panel);color:var(--ink)}
@media(max-width:640px){.ceremony-card{width:50%}}
</style>
