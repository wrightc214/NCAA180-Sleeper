# NCAA 180 push store. Deployed by .github/workflows/push-worker.yml (not by hand).
# The D1 database id is filled in at deploy time from the repo variable D1_DATABASE_ID,
# so nothing account-specific is committed.
name = "ncaa180-push"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://wrightc214.github.io"

[[d1_databases]]
binding = "DB"
database_name = "ncaa180-push"
database_id = "__D1_DATABASE_ID__"
